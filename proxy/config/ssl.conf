# These are configured at the root and apply to all servers which have "ssl" in their "listen" config
# Doing this here enables session resumption, which is always via the default server.

# Use recent protocols and cyphers (disable insecure cyphers)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers HIGH:!aNULL:!MD5:!PSK:!CAMELLIA:!SHA1:!SHA256:!SHA384:!AES128:!ARIA128:!AES256-GCM-SHA384:!AES256-CCM8:!AES256-CCM:!ARIA256-GCM-SHA384;
ssl_dhparam /etc/nginx/dhparam.pem;

# test cipher options with:
# openssl ciphers -tls1 'HIGH:!aNULL:!MD5' | tr ':' '\n'
# see https://www.openssl.org/docs/man1.0.2/man1/ciphers.html

# Reduce server load by using shared cache for SSL
# Also enables key rotation for ssl_session_tickets (see https://github.com/nginx/nginx/commit/1d572e359a210dcb27e5e073c016c1768c435263)
ssl_session_cache shared:SSL:5M;
ssl_session_timeout 90m;

# Automatic key rotation can be confirmed from the client by running:
# openssl s_client -connect davidje13.com:443 -tls1_2 -servername davidje13.com </dev/null 2>/dev/null | grep -A14 'TLS session ticket:'
# - the TLS session ticket uses the first 16 bytes for a key ID
# - run twice with a short delay to confirm the first 16 bytes do not change (but the rest does)
# - wait long enough for a key rotation, then run again to confirm the key ID changes

# Have supporting clients store their own encrypted keys to save memory
ssl_session_tickets on;
# ssl_session_ticket_key - use random value; automatically rotates at interval of ssl_session_timeout

# Ensure early data is off so that we don't have to worry about replay attacks
ssl_early_data off;

# ssl_stapling cannot be configured: Let's Encrypt does not support OCSP any more
# https://letsencrypt.org/2024/12/05/ending-ocsp
